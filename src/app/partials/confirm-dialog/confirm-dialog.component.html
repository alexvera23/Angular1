<h2 mat-dialog-title>{{ data.title }}</h2>
    <mat-dialog-content [innerHTML]="data.mesage"></mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-button [matDialogClose]="false">Cancelar</button>
      
      
      <button mat-button 
              [color]="data.confirmColor || 'warn'" 
              [matDialogClose]="true" 
              cdkFocusInitial>
        {{ data.confirmText || 'Eliminar' }}
      </button>
    </mat-dialog-actions>
